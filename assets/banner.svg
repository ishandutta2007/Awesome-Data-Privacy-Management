<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Animations -->
    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-18px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes shieldPulse {
        0%, 100% { filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.7)); }
      }

      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
      .glow-bg { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .shield-icon { animation: shieldPulse 4s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 8 12; animation: dashFlow 20s linear infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glow Center -->
  <circle cx="950" cy="160" r="220" fill="url(#glow)" class="glow-bg" />
  <circle cx="200" cy="80" r="150" fill="url(#glow)" class="glow-bg" />

  <!-- Grid Pattern Overlay -->
  <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Dynamic Data Stream Lines (Background) -->
  <path d="M 50,260 Q 300,300 600,240 T 1150,220" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" class="data-stream" />
  <path d="M 50,60 Q 400,20 800,100 T 1150,50" fill="none" stroke="#a855f7" stroke-opacity="0.25" stroke-width="2" class="data-stream" />

  <!-- Floating Particles (Background Aspect) -->
  <circle cx="150" cy="220" r="4" fill="#38bdf8" class="particle-1" />
  <circle cx="450" cy="70" r="5" fill="#a855f7" class="particle-2" />
  <circle cx="780" cy="250" r="3.5" fill="#f472b6" class="particle-3" />
  <circle cx="1080" cy="90" r="6" fill="#38bdf8" class="particle-1" />

  <!-- Decorative Shield Graphic (Right Side Background/Middle) -->
  <g transform="translate(930, 70)" class="shield-icon">
    <path d="M 80 10 L 150 40 V 100 C 150 150 80 180 80 180 C 80 180 10 150 10 100 V 40 Z" fill="url(#shield-grad)" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 80 40 L 120 60 V 95 C 120 125 80 145 80 145 C 80 145 40 125 40 95 V 60 Z" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Lock Keyhole Icon inside Shield -->
    <rect x="71" y="80" width="18" height="24" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="80" cy="75" r="7" fill="#ffffff" fill-opacity="0.9" />
  </g>

  <!-- FOREGROUND CONTENT: Guarantee Title and Subtitle Visibility -->
  <!-- Title -->
  <text x="70" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="40" fill="url(#title-grad)">
    Awesome Data Privacy Management
  </text>

  <!-- Subtitle -->
  <text x="70" y="158" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="18" fill="#e2e8f0">
    Curated SaaS Platforms, Open-Source Tools, DSAR Automation &amp; Compliance Frameworks
  </text>

  <!-- Feature Pills (Foreground Bottom Left) -->
  <g transform="translate(70, 195)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="72" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">🛡️ Privacy Ops</text>

    <!-- Pill 2 -->
    <rect x="157" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
    <text x="239" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">⚡ DSAR Automation</text>

    <!-- Pill 3 -->
    <rect x="334" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#f472b6" stroke-width="1.2" />
    <text x="409" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">🔍 PII Discovery</text>

    <!-- Pill 4 -->
    <rect x="496" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <text x="576" y="22" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">📋 GDPR &amp; CCPA</text>
  </g>

  <!-- Footer Tag -->
  <text x="70" y="275" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" font-weight="400">
    Updated for Enterprise Privacy Engineering &amp; Data Governance Standards
  </text>
</svg>
